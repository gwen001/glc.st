baseURL = "https://glc.st/"
# baseURL = "http://glc.st.local.net/"
googleAnalytics = "G-NRF716WMB7"
languageCode = "en-us"
# title = "Gwendal Le Coguic origin"
# title = "Gwendal Le Coguic | Independent cybersecurity expert: pentest, audits, courses, bug bounty 1111"
theme = "coder"

defaultcontentlanguage = "en"
defaultContentLanguageInSubdir = false

# paginate = 2000
pagination.pagerSize = 2000
canonifyurls = true

pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true
pygmentsUseClassic = false

disqusShortname = ""

# disableKinds = ['RSS']
disableKinds = ['RSS','taxonomy','term']

[markup.goldmark.renderer]
unsafe= true

[taxonomies]
  tag = "tags"

# Social links
[[params.social]]
    name = "Github"
    icon = "fab fa-github"
    weight = 1
    url = "https://github.com/gwen001/"
[[params.social]]
    name = "Linkedin"
    icon = "fab fa-linkedin"
    weight = 2
    url = "https://www.linkedin.com/in/gwendal-le-coguic/"
[[params.social]]
    name = "Twitter"
    icon = "fab fa-x-twitter"
    weight = 3
    url = "https://x.com/gwendallecoguic/"

[permalinks]
  posts = "/posts/:title/"
  # cves = "/cves/:slug/"

